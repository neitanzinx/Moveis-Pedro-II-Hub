services:
  app:
    build: .
    container_name: moveis-pedro-ii-app
    restart: always
    ports:
      - "80:3001"
    env_file:
      - .env
    volumes:
      # Persistir a sessão do WhatsApp para não perder o QR Code ao reiniciar
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache
    environment:
      - NODE_ENV=production
